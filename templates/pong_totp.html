<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm - Wellness Ping</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Verification Required</h1>
    <p>Enter the 6-digit code from your authenticator app.</p>

    <form action="{{.Action}}" method="POST">
        <input type="hidden" name="step" value="totp">
        <label for="code">Code</label>
        <input type="text" id="code" name="code" class="otp-input" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
        <button type="submit">Continue</button>
    </form>

    <p><a href="/">Back to home</a></p>

    <footer>Version: <span class="version">{{.Version}}</span></footer>
    <script src="/static/version.js"></script>
</body>

</html>
