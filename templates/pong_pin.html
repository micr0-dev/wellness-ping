<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm - Wellness Ping</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Verification Required</h1>
    <p>Enter your PIN to continue.</p>

    <form action="{{.Action}}" method="POST">
        <input type="hidden" name="step" value="pin">
        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" autocomplete="one-time-code" required autofocus>
        <button type="submit">Continue</button>
    </form>

    <p><a href="/">Back to home</a></p>

    <footer>Version: <span class="version">{{.Version}}</span></footer>
    <script src="/static/version.js"></script>
</body>

</html>
